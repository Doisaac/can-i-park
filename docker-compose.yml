services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: can-i-park-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  acceso:
    build:
      context: .
      dockerfile: servicios/acceso/Dockerfile
    container_name: can-i-park-acceso
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TOPIC_MOVIMIENTOS: ${TOPIC_MOVIMIENTOS:-can-i-park.movimientos}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
    ports:
      - "8001:8000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  disponibilidad:
    build:
      context: .
      dockerfile: servicios/disponibilidad/Dockerfile
    container_name: can-i-park-disponibilidad
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TOPIC_MOVIMIENTOS: ${TOPIC_MOVIMIENTOS:-can-i-park.movimientos}
      TOPIC_ESTADOS: ${TOPIC_ESTADOS:-can-i-park.estados}
      CAPACIDAD_ESTACIONAMIENTO: ${CAPACIDAD_ESTACIONAMIENTO:-100}
      UMBRAL_POCOS_ESPACIOS: ${UMBRAL_POCOS_ESPACIOS:-10}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
    ports:
      - "8002:8000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  interfaz:
    build:
      context: .
      dockerfile: interfaz/Dockerfile
    container_name: can-i-park-interfaz
    ports:
      - "8080:80"
    depends_on:
      acceso:
        condition: service_healthy
      disponibilidad:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  notificaciones:
    build:
      context: .
      dockerfile: servicios/notificaciones/Dockerfile
    container_name: can-i-park-notificaciones
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TOPIC_ESTADOS: ${TOPIC_ESTADOS:-can-i-park.estados}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
    ports:
      - "8003:8000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  pruebas:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      ACCESO_URL: http://acceso:8000
      DISPONIBILIDAD_URL: http://disponibilidad:8000
      NOTIFICACIONES_URL: http://notificaciones:8000
      INTERFAZ_URL: http://interfaz
    volumes:
      - ./docs:/workspace/docs
