[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canipark-shared"
version = "1.1.0"
description = "Contratos y utilidades reutilizables para Can I Park?"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3.0",
    "confluent-kafka>=2.6,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["canipark_shared*"]