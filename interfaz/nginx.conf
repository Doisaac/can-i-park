server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/acceso/ {
        proxy_pass http://acceso:8000/;
        proxy_set_header Host $host;
    }

    location /api/disponibilidad/ {
        proxy_pass http://disponibilidad:8000/;
        proxy_set_header Host $host;
    }

    location /api/notificaciones/ {
        proxy_pass http://notificaciones:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
